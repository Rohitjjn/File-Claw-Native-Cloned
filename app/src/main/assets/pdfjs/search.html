<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=8, user-scalable=yes">
  <title>File Claw PDF Reader</title>
  <style>
    /* Loop 14: PDF is ALWAYS light mode. The dark palette, the invert/natural page
       classifier and every night-mode CSS rule were removed — the viewer keeps the
       original light look no matter what the system or in-app theme says. */
    :root {
      color-scheme: light;
      --reader-background: #f0f0f0;
      --page-background: #ffffff;
      --page-shadow: 0 4px 20px rgba(0, 0, 0, .14);
      --page-border: rgba(25, 25, 25, .10);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: auto;
      background: var(--reader-background);
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: contain;
    }
    #pdf-document {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 12px 10px 32px;
    }
    .pdf-page {
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      background: var(--page-background);
      border: 1px solid var(--page-border);
      box-shadow: var(--page-shadow);
      border-radius: 12px;
      transform-origin: top center;
    }
    .pdf-page canvas {
      display: block;
      max-width: none;
      background: white;
      border-radius: 12px;
    }
    .highlight-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: 12px;
    }
    .pdf-search-highlight {
      position: absolute;
      min-width: 2px;
      background: rgba(204, 120, 92, .48);
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(122, 61, 40, .25);
    }
    .pdf-search-highlight.active {
      background: rgba(232, 165, 90, .82);
      outline: 2px solid rgba(204, 120, 92, .95);
      z-index: 2;
    }
    /* Rounded loading indicator for a page that has no bitmap yet (replaces the old
       grey shimmer skeleton). A round-capped arc spins in the middle of the page. */
    .pdf-page.skeleton::before {
      content: '';
      position: absolute;
      left: 50%;
      top: min(50%, 220px);
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><circle cx='22' cy='22' r='17' fill='none' stroke='%23cc785c' stroke-opacity='.18' stroke-width='5'/><circle cx='22' cy='22' r='17' fill='none' stroke='%23cc785c' stroke-width='5' stroke-linecap='round' stroke-dasharray='30 77'/></svg>") center / contain no-repeat;
      animation: pdf-round-spin .9s linear infinite;
      pointer-events: none;
    }
    @keyframes pdf-round-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pdf-page.skeleton::before { animation-duration: 2.4s; }
    }
    /* Loop 12 (Bug C): per-page render failure recovery. A failed page used to stay
       permanently blank until the user scrolled far enough away and back. */
    .page-failure {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--page-background);
      color: #8a8a8a;
      font: 13px/1.5 sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      z-index: 3;
    }
    .page-failure button {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid rgba(25, 25, 25, .2);
      background: rgba(204, 120, 92, .14);
      color: #a9583e;
      font: 600 13px sans-serif;
    }
  </style>
</head>
<body>
  <main id="pdf-document" aria-label="PDF document"></main>
  <script>
    // Boot guard. A module that fails to download or parse (very old WebView, missing
    // asset) never reaches its own code, so the page itself must report it - otherwise
    // the app would sit on its loading indicator forever.
    window.__pdfBooted = false;
    window.__pdfBootError = function (reason) {
      if (window.__pdfBooted || window.__pdfBootReported) return;
      window.__pdfBootReported = true;
      try {
        if (window.Android && window.Android.onPdfError) {
          window.Android.onPdfError('The PDF engine could not start (' + String(reason || 'unknown') + ').');
        }
      } catch (_) {}
    };
    window.addEventListener('error', function (event) {
      if (!event) return;
      if (!window.__pdfBooted) { window.__pdfBootError(event.message || 'script error'); return; }
      if (window.Android && window.Android.onPdfError && event.message && event.message !== 'ResizeObserver loop limit exceeded') {
        console.warn('PDF page error: ' + event.message);
      }
    });
    setTimeout(function () { window.__pdfBootError('start-up timeout'); }, 10000);
  </script>
  <script type="module" onerror="window.__pdfBootError('module load failed')">
    import './pdf.compat.mjs';
    import * as pdfjsLib from './pdf.min.mjs';

    const assetBase = '/assets/pdfjs/';
    const pdfUrl = '/search-pdf/document.pdf';
    const maxStoredMatches = 2000;
    const maxRectsPerMatch = 24;
    // v1.3.0: hi-DPI aware rasterization budget. Each rendered page backs at most
    // ~pagePixelBudget device pixels, but the ratio now SCALES WITH THE PINCH ZOOM so
    // zoomed pages stay crisp instead of magnifying a fixed-resolution bitmap.
    // Loop 10: Android pushes a device-tiered value via setPdfQualityBudget().
    // Loop 12: the argument is now the TOTAL RGBA budget across simultaneously
    // resident canvases (mirrors PdfRenderBudgetPolicy.totalCanvasBytes); the per-page
    // budget is derived from it so aggregate canvas memory stays bounded. A fixed
    // per-page number ignored that 3-5 pages are resident at once inside the
    // IntersectionObserver prefetch window — the main reason heavy PDFs struggled.
    let pagePixelBudget = 12.0e6;
    // Loop 10 raised this from 6 to 8 with the device-tiered budget; Loop 14 keeps 8.
    const maxRenderRatio = 8;
    // Mirrors PdfRenderBudgetPolicy.RESIDENT_PAGE_WINDOW / BYTES_PER_PIXEL.
    const residentPageWindow = 3;
    const bytesPerPixel = 4;
    const minPagePixelBudget = 4.0e6;
    const maxPagePixelBudget = 24.0e6;
    // Mirrors PdfCanvasDimensionPolicy: exceeding these limits makes Chromium silently
    // ignore all draw commands (permanently blank canvas), so oversized pages are
    // downsampled below ratio 1 instead of rendering blank.
    const maxCanvasDimensionPx = 8192;
    const minRenderRatio = 0.05;
    let renderScaleHint = 1;
    pdfjsLib.GlobalWorkerOptions.workerSrc = assetBase + 'pdf.worker.shim.mjs';
    window.__pdfBooted = true;

    let pdfDocument = null;
    let loadingPromise = null;
    let passwordUpdater = null;
    let indexedPages = new Map();
    // Loop 12 (Bug C): bounded retention for extracted page text. Keeping every
    // searched page's full text + piece geometry alive duplicated the document in
    // memory for the lifetime of the viewer.
    const indexedPageLimit = 128;
    const indexedLruOrder = [];
    let pageRecords = [];
    let searchMatches = [];
    let activeMatchIndex = -1;
    let latestRequestId = 0;
    let currentZoom = 1;
    let pageObserver = null;
    let currentPage = 0;
    // Loop 14: PDF view rotation in degrees clockwise (0/90/180/270), driven from
    // Android via setPageRotation(). Pure viewer state — rotating NEVER reloads the
    // document, recreates the WebView or re-runs the password flow: pages are
    // re-rendered from the already-authenticated PDF.js document object.
    let pageRotation = 0;

    function bridgeCall(name, ...args) {
      try {
        if (window.Android && typeof window.Android[name] === 'function') {
          window.Android[name](...args);
        }
      } catch (error) {
        console.error('File Claw PDF bridge failed', error);
      }
    }

    function publishResults(payload) {
      bridgeCall('onPdfSearchResults', JSON.stringify(payload));
    }

    function publishError(requestId, query, error) {
      if (requestId !== latestRequestId) return;
      bridgeCall('onPdfSearchError', JSON.stringify({
        requestId: requestId,
        query: query,
        message: String(error && (error.message || error) || 'PDF text search failed')
      }));
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function shouldInsertSpace(previous, current) {
      if (!previous || previous.hasEOL || /\s$/.test(previous.str) || /^\s/.test(current.str)) return false;
      const previousTransform = previous.transform;
      const nextTransform = current.transform;
      if (!previousTransform || !nextTransform) return false;
      const sameLine = Math.abs(previousTransform[5] - nextTransform[5]) <= Math.max(previous.height, current.height, 1) * 0.45;
      if (!sameLine) return true;
      const gap = nextTransform[4] - (previousTransform[4] + previous.width);
      return gap > Math.max(previous.height, current.height, 1) * 0.16;
    }

    async function getIndexedPage(pageNumber) {
      const cached = indexedPages.get(pageNumber);
      if (cached) {
        // Touch: keep recently used pages at the back of the eviction order.
        const position = indexedLruOrder.indexOf(pageNumber);
        if (position >= 0 && position !== indexedLruOrder.length - 1) {
          indexedLruOrder.splice(position, 1);
          indexedLruOrder.push(pageNumber);
        }
        return cached;
      }
      const page = await pdfDocument.getPage(pageNumber);
      const viewport = page.getViewport({ scale: 1 });
      const textContent = await page.getTextContent();
      const pieces = [];
      let fullText = '';
      let previous = null;

      for (const item of textContent.items) {
        if (!item || typeof item.str !== 'string' || item.str.length === 0) continue;
        const entry = {
          str: item.str,
          transform: item.transform,
          width: Math.abs(Number(item.width) || 0),
          height: Math.abs(Number(item.height) || 0),
          hasEOL: Boolean(item.hasEOL),
          start: 0,
          end: 0
        };
        if (previous && previous.hasEOL) fullText += '\n';
        else if (shouldInsertSpace(previous, entry)) fullText += ' ';
        entry.start = fullText.length;
        fullText += entry.str;
        entry.end = fullText.length;
        pieces.push(entry);
        previous = entry;
      }

      const result = { text: fullText, pieces: pieces, viewport: viewport };
      indexedPages.set(pageNumber, result);
      indexedLruOrder.push(pageNumber);
      while (indexedLruOrder.length > indexedPageLimit) {
        const oldest = indexedLruOrder.shift();
        if (oldest !== pageNumber) indexedPages.delete(oldest);
      }
      return result;
    }

    function makeRect(page, piece, localStart, localEnd) {
      const viewport = page.viewport;
      const transform = pdfjsLib.Util.transform(viewport.transform, piece.transform);
      const fontHeight = Math.max(Math.hypot(transform[2], transform[3]), piece.height, 1);
      const startFraction = piece.str.length > 0 ? localStart / piece.str.length : 0;
      const endFraction = piece.str.length > 0 ? localEnd / piece.str.length : 1;
      const direction = transform[0] < 0 ? -1 : 1;
      const x1 = transform[4] + direction * piece.width * startFraction;
      const x2 = transform[4] + direction * piece.width * endFraction;
      const left = Math.min(x1, x2);
      const right = Math.max(x1, x2);
      const top = transform[5] - fontHeight;
      const bottom = transform[5] + Math.max(1, fontHeight * .18);
      const unrotated = {
        left: Math.max(0, Math.min(1, left / viewport.width)),
        top: Math.max(0, Math.min(1, top / viewport.height)),
        right: Math.max(0, Math.min(1, right / viewport.width)),
        bottom: Math.max(0, Math.min(1, bottom / viewport.height))
      };
      // Loop 14: rects are stored in UNROTATED page space; drawHighlights maps them
      // into the current display orientation on every draw, so highlights follow
      // the text through rotation without re-searching (PdfRotationPolicy.rotateRect
      // mirrors this mapping in the tested Kotlin policy).
      return unrotated;
    }

    function rotateNormRect(rect, degrees) {
      const rotation = ((Math.round(degrees) % 360) + 360) % 360;
      if (rotation === 0) return rect;
      if (rotation === 90) {
        return {
          left: 1 - rect.bottom, top: rect.left,
          right: 1 - rect.top, bottom: rect.right
        };
      }
      if (rotation === 180) {
        return {
          left: 1 - rect.right, top: 1 - rect.bottom,
          right: 1 - rect.left, bottom: 1 - rect.top
        };
      }
      if (rotation === 270) {
        return {
          left: rect.top, top: 1 - rect.right,
          right: rect.bottom, bottom: 1 - rect.left
        };
      }
      return rect;
    }

    function computePageScale(baseWidth) {
      const availableWidth = Math.max(240, (window.innerWidth || document.documentElement.clientWidth || 360) - 24);
      return Math.max(.1, Math.min(availableWidth / Math.max(1, baseWidth), 2.5)) * currentZoom;
    }

    // Loop 14: fit scale must use the ROTATED base width, otherwise quarter-turn
    // pages are fit against the wrong axis and overflow horizontally.
    function rotatedBaseWidth(baseWidth, baseHeight) {
      return (pageRotation % 180 === 90) ? baseHeight : baseWidth;
    }

    function pageScale(page) {
      const base = page.getViewport({ scale: 1 });
      return computePageScale(rotatedBaseWidth(base.width, base.height));
    }

    // Loop 12 (Bug C): pages are no longer all fetched up front. Records start with
    // page = null and a placeholder geometry estimated from page 1 (the official
    // pdf.js viewer does the same); the real PDFPageProxy is fetched once when the
    // page first approaches the viewport and dropped again when it is released. This
    // keeps a 1000-page document's worker memory bounded by what was actually viewed.
    async function ensurePage(record) {
      if (record.page) return record.page;
      if (!record.pagePromise) {
        record.pagePromise = pdfDocument.getPage(record.pageNumber).then(function (page) {
          record.pagePromise = null;
          if (record.disposed) {
            try { page.cleanup(); } catch (_) {}
            return null;
          }
          record.page = page;
          return page;
        }).catch(function (error) {
          record.pagePromise = null;
          throw error;
        });
      }
      return record.pagePromise;
    }

    function applyRecordSize(record, viewport) {
      record.element.style.width = viewport.width + 'px';
      record.element.style.height = viewport.height + 'px';
      record.canvas.style.width = viewport.width + 'px';
      record.canvas.style.height = viewport.height + 'px';
    }

    // Loop 14: pdf.js viewport with the user rotation baked in (the page's own
    // intrinsic /Rotate is included by pdf.js in page.rotate; the user rotation is
    // added on top and the total normalized). Mirrors PdfRotationPolicy.normalize.
    function pageViewport(page, scale) {
      const totalRotation = (((Number(page.rotate) || 0) + pageRotation) % 360 + 360) % 360;
      return page.getViewport({ scale: scale, rotation: totalRotation });
    }

    function updateRecordGeometry(record, keepCanvas) {
      if (!record.page) return; // placeholder records keep their estimated size
      const nextViewport = pageViewport(record.page, pageScale(record.page));
      if (record.viewport &&
          Math.abs(record.viewport.width - nextViewport.width) < 0.5 &&
          Math.abs(record.viewport.height - nextViewport.height) < 0.5) {
        record.viewport = nextViewport;
        return; // unchanged: avoid canceling renders and zeroing canvases (focus-mode flicker)
      }
      record.viewport = nextViewport;
      applyRecordSize(record, nextViewport);
      record.rendered = false;
      if (record.renderTask) {
        try { record.renderTask.cancel(); } catch (_) {}
        record.renderTask = null;
      }
      // keepCanvas=true (Loop 14 rotation): the old bitmap stays visible and the
      // freshly rendered, correctly rotated canvas replaces it atomically — no
      // blank flash while the new orientation renders. Zoom keeps the original
      // zero-and-realloc behavior (bounds shrink, memory freed sooner).
      if (!keepCanvas) {
        record.canvas.width = 0;
        record.canvas.height = 0;
        showRecordSkeleton(record);
      }
      drawHighlights(record);
    }

    // Backing-pixel ratio the page may use right now: screen density x WebView pinch
    // scale, clamped by the ratio cap, the per-page pixel budget AND a per-dimension
    // ceiling (Loop 12, mirrors PdfCanvasDimensionPolicy). There is deliberately NO
    // floor of 1.0: a page whose 1x area already exceeds the budget is downsampled
    // into a legal canvas instead of producing an oversized canvas that Chromium
    // silently renders blank (pdf.js #11195 class of bugs).
    function renderPixelRatio(record) {
      const width = Math.max(1, record.viewport.width);
      const height = Math.max(1, record.viewport.height);
      const desired = (window.devicePixelRatio || 1) * Math.max(1, renderScaleHint);
      const areaCap = Math.sqrt(pagePixelBudget / (width * height));
      const dimensionCap = maxCanvasDimensionPx / Math.max(width, height);
      return Math.max(minRenderRatio, Math.min(desired, maxRenderRatio, areaCap, dimensionCap));
    }

    // Loop 12 (Bug C): keep at most residentPageWindow canvases alive. The least
    // recently rendered page that is NOT currently on screen is released first;
    // visible pages are never evicted from under the user.
    function enforceResidentWindow() {
      let renderedCount = 0;
      pageRecords.forEach(function (record) { if (record.rendered) renderedCount++; });
      if (renderedCount <= residentPageWindow) return;
      const candidates = pageRecords
        .filter(function (record) { return record.rendered && !record.visible && !record.renderTask; })
        .sort(function (a, b) { return (a.lastRenderedAt || 0) - (b.lastRenderedAt || 0); });
      for (let index = 0; index < candidates.length && renderedCount > residentPageWindow; index++) {
        releaseRecord(candidates[index]);
        if (!candidates[index].rendered) renderedCount--;
      }
    }

    // Loop 14 (skeletons): a page element carries the 'skeleton' class only while it
    // has no usable bitmap — after prepareDocument, after a release, or while an
    // updateRecordGeometry pass zeroed the canvas. The class is removed the moment a
    // real canvas is swapped in, and never drawn over live content.
    function showRecordSkeleton(record) {
      if (record.element) record.element.classList.add('skeleton');
    }

    function clearRecordSkeleton(record) {
      if (record.element) record.element.classList.remove('skeleton');
    }

    // Loop 12 (Bug C): a failed page shows a local retry affordance instead of
    // staying permanently blank until the user scrolls away and back.
    function showPageFailure(record) {
      if (record.failureOverlay) return;
      const overlay = document.createElement('div');
      overlay.className = 'page-failure';
      const label = document.createElement('span');
      label.textContent = 'This page could not be rendered.';
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = 'Retry';
      overlay.appendChild(label);
      overlay.appendChild(retry);
      overlay.addEventListener('click', function (event) {
        event.stopPropagation();
        retryPage(record.pageNumber);
      });
      record.element.appendChild(overlay);
      record.failureOverlay = overlay;
    }

    function clearPageFailure(record) {
      if (record.failureOverlay && record.failureOverlay.parentNode === record.element) {
        record.element.removeChild(record.failureOverlay);
      }
      record.failureOverlay = null;
      record.renderFailed = false;
    }

    function retryPage(pageNumber) {
      const record = pageRecords[pageNumber - 1];
      if (!record) return;
      clearPageFailure(record);
      renderRecord(record);
    }

    async function renderRecord(record) {
      if (record.rendered || record.renderTask || record.renderStarting || record.renderFailed || !record.viewport) return;
      // Reserve the render slot BEFORE the async page fetch: two observer callbacks
      // racing the same record must not both reach page.render() (per-canvas render
      // tasks stay strictly serialized).
      record.renderStarting = true;
      try {
        const page = await ensurePage(record);
        if (!page || record.disposed) return;
        // The placeholder size was estimated from page 1; sync to the real page
        // geometry before rasterizing (uniform-size documents are a no-op here).
        updateRecordGeometry(record, false);
        if (!record.viewport || record.rendered || record.renderTask || record.renderFailed) return;
        enforceResidentWindow();
        const pixelRatio = renderPixelRatio(record);
        // Already backed at (or above) the achievable ratio: re-rendering would be a
        // redundant render storm, not a quality gain (Loop 10).
        if (record.canvas.width > 0 &&
            record.canvas.width >= Math.floor(record.viewport.width * pixelRatio) - 1) {
          record.rendered = true;
          return;
        }
        // Loop 10: render into a fresh offscreen canvas and swap it in only when the
        // render completes. Previously the SAME canvas was resized up-front, which
        // destroyed the old bitmap and flashed a blank page after every pinch.
        const target = document.createElement('canvas');
        target.width = Math.max(1, Math.floor(record.viewport.width * pixelRatio));
        target.height = Math.max(1, Math.floor(record.viewport.height * pixelRatio));
        target.style.width = record.viewport.width + 'px';
        target.style.height = record.viewport.height + 'px';
        const context = target.getContext('2d', { alpha: false });
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, target.width, target.height);
        const task = page.render({
          canvasContext: context,
          viewport: record.viewport,
          transform: [pixelRatio, 0, 0, pixelRatio, 0, 0],
          background: 'rgb(255,255,255)'
        });
        record.renderTask = task;
        try {
          await task.promise;
          if (!record.viewport || record.disposed) return; // geometry was reset while rendering
          const stale = record.canvas;
          if (stale && stale.parentNode === record.element) {
            record.element.replaceChild(target, stale);
          } else {
            record.element.insertBefore(target, record.highlightLayer);
          }
          if (stale) {
            stale.width = 0;
            stale.height = 0;
          }
          record.canvas = target;
          record.renderedRatio = pixelRatio;
          record.rendered = true;
          record.lastRenderedAt = Date.now();
          record.renderTask = null; // slot free; the finally below stays a no-op
          clearPageFailure(record);
          clearRecordSkeleton(record);
          drawHighlights(record);
          enforceResidentWindow();
          // The page may have scrolled out of the prefetch window while this render
          // was in flight; do not keep the fresh bitmap resident in that case.
          if (!record.visible) {
            releaseRecord(record);
          } else if (renderPixelRatio(record) > pixelRatio + 0.01) {
            // Bounded one-shot follow-up: if the achievable ratio grew while this
            // render was in flight (budget push / settle), re-render once instead of
            // leaving a stale-sharpness page behind. renderRecord early-returns once
            // the current ratio is reached.
            record.rendered = false;
            renderRecord(record);
          }
        } catch (error) {
          if (error && error.name !== 'RenderingCancelledException') {
            console.warn('PDF page render failed', error);
            record.renderFailed = true;
            showPageFailure(record);
          }
          // Release the discarded offscreen buffer promptly on failure/cancellation.
          target.width = 0;
          target.height = 0;
        } finally {
          if (record.renderTask === task) record.renderTask = null;
        }
      } finally {
        record.renderStarting = false;
      }
    }

    // Loop 14: the per-page dark-mode classifier was removed with the PDF night
    // mode itself — PDF pages now always display their original light colors.

    // v1.3.0 crisp zoom: called by Android (onScaleChanged) after a pinch settles.
    // Re-renders the already-visible pages with a higher backing resolution WITHOUT
    // changing the CSS layout, so the page does not jump — Google Drive behavior.
    // The old canvas stays on screen until the sharper one is ready (no blank flash).
    // Loop 14: the hint cap follows the viewport's maximum-scale (8x).
    function setPdfRenderScale(scale) {
      const next = Math.max(1, Math.min(8, Number(scale) || 1));
      if (Math.abs(next - renderScaleHint) < 0.05) return;
      renderScaleHint = next;
      pageRecords.forEach(function (record) {
        if (record.rendered && record.canvas && record.canvas.width > 0 && !record.renderTask) {
          record.rendered = false;
          renderRecord(record);
        }
      });
    }

    // Loop 12 (Bug 3B / C): Android pushes the TOTAL RGBA budget across resident
    // canvases (PdfRenderBudgetPolicy.totalCanvasBytes, heap-signal derived); the
    // per-page budget is derived so aggregate canvas memory stays bounded no matter
    // how many pages the prefetch window touches.
    function setPdfQualityBudget(totalBytes) {
      const value = Math.max(0, Number(totalBytes) || 0);
      if (!value) return;
      const perPage = Math.max(
        minPagePixelBudget,
        Math.min(maxPagePixelBudget, value / (residentPageWindow * bytesPerPixel))
      );
      if (Math.abs(perPage - pagePixelBudget) < 1) return;
      pagePixelBudget = perPage;
      pageRecords.forEach(function (record) {
        if (record.rendered && record.canvas && record.canvas.width > 0 && !record.renderTask) {
          record.rendered = false;
          renderRecord(record);
        }
      });
    }

    function releaseRecord(record) {
      if (record.renderTask || record.renderStarting) return;
      if (!record.rendered && !record.page) return;
      record.canvas.width = 0;
      record.canvas.height = 0;
      record.rendered = false;
      showRecordSkeleton(record);
      clearPageFailure(record);
      // Loop 12: drop the PDFPageProxy as well. page.cleanup() frees the worker-side
      // operator list and decoded objects for this page (it is a safe no-op while a
      // render is active, which the guard above already prevents); the proxy is
      // re-fetched from pdfDocument when the page becomes visible again.
      if (record.page) {
        try { record.page.cleanup(); } catch (_) {}
        record.page = null;
      }
    }

    function drawHighlights(record) {
      if (!record || !record.highlightLayer) return;
      record.highlightLayer.replaceChildren();
      for (let matchIndex = 0; matchIndex < searchMatches.length; matchIndex++) {
        const match = searchMatches[matchIndex];
        if (match.pageNumber !== record.pageNumber) continue;
        for (const storedRect of match.rectangles) {
          // Loop 14: stored rects live in unrotated page space and are mapped into
          // the CURRENT display orientation here, on every draw.
          const rect = rotateNormRect(storedRect, pageRotation);
          const highlight = document.createElement('div');
          highlight.className = 'pdf-search-highlight' + (matchIndex === activeMatchIndex ? ' active' : '');
          highlight.style.left = (rect.left * 100) + '%';
          highlight.style.top = (rect.top * 100) + '%';
          highlight.style.width = (Math.max(.003, rect.right - rect.left) * 100) + '%';
          highlight.style.height = (Math.max(.002, rect.bottom - rect.top) * 100) + '%';
          record.highlightLayer.appendChild(highlight);
        }
      }
    }

    // ---------------------------------------------------------------------------
    // Page scroller support. Position is measured in PAGE space, so the Android
    // scrubber handle moves 0..1 from the first page to the last page exactly, even
    // when pages have different heights, and a drag maps back to the same spot.
    // ---------------------------------------------------------------------------
    function docScroller() {
      return document.scrollingElement || document.documentElement || document.body;
    }

    function clamp01(value) {
      return Math.min(1, Math.max(0, Number(value) || 0));
    }

    // Index of the page whose top edge is the last one at or above document-y `y`.
    function pageIndexAtY(y) {
      let low = 0;
      let high = pageRecords.length - 1;
      let answer = 0;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (pageRecords[mid].element.offsetTop <= y) { answer = mid; low = mid + 1; }
        else { high = mid - 1; }
      }
      return answer;
    }

    // index + fraction of that page for a given scrollTop (page space).
    function pageSpaceAt(scrollTop) {
      const index = pageIndexAtY(scrollTop);
      const element = pageRecords[index].element;
      const within = clamp01((scrollTop - element.offsetTop) / Math.max(1, element.offsetHeight));
      return index + within;
    }

    function maxScrollTop() {
      const scroller = docScroller();
      return Math.max(0, scroller.scrollHeight - (window.innerHeight || scroller.clientHeight || 0));
    }

    function computeScrollState() {
      const total = pageRecords.length;
      const scroller = docScroller();
      const max = maxScrollTop();
      const top = Math.min(max, Math.max(0, scroller.scrollTop));
      let page;
      if (top <= 1) page = 1;
      else if (max > 1 && top >= max - 2) page = total;
      else page = pageIndexAtY(top + (window.innerHeight || 0) * 0.35) + 1;
      const endSpace = pageSpaceAt(max);
      const position = endSpace > 0 ? clamp01(pageSpaceAt(top) / endSpace) : 0;
      return { page: Math.max(1, Math.min(total, page)), total: total, position: position };
    }

    let lastReportedPosition = -1;
    let scrollReportScheduled = false;
    function reportScrollState() {
      scrollReportScheduled = false;
      if (!pageRecords.length) return;
      const state = computeScrollState();
      const pageChanged = state.page !== currentPage;
      if (pageChanged) {
        currentPage = state.page;
        bridgeCall('onPdfPageChanged', state.page, state.total);
      }
      if (pageChanged || Math.abs(state.position - lastReportedPosition) > 0.0015) {
        lastReportedPosition = state.position;
        bridgeCall('onPdfScrollProgress', state.page, state.total, state.position);
      }
    }

    function scheduleScrollReport() {
      if (scrollReportScheduled) return;
      scrollReportScheduled = true;
      requestAnimationFrame(reportScrollState);
    }

    // Instant, un-animated jump used while the scroller handle is dragged.
    function scrubToPosition(position) {
      if (!pageRecords.length) return;
      const scroller = docScroller();
      const max = maxScrollTop();
      const p = clamp01(position);
      if (p >= 0.999) { scroller.scrollTop = max; return; }
      if (p <= 0.001) { scroller.scrollTop = 0; return; }
      const target = p * pageSpaceAt(max);
      const index = Math.min(pageRecords.length - 1, Math.floor(target));
      const element = pageRecords[index].element;
      scroller.scrollTop = Math.min(max, element.offsetTop + (target - index) * element.offsetHeight);
    }

    window.addEventListener('scroll', scheduleScrollReport, { passive: true });

    // Placeholder records have no page proxy yet; re-derive their estimated size so
    // zoom and rotation changes keep the scroll layout roughly correct before first
    // render. Loop 14: quarter turns swap the estimated axes (PdfRotationPolicy).
    function updatePlaceholderGeometry(record) {
      if (record.page || !record.baseWidth) return;
      const scale = computePageScale(rotatedBaseWidth(record.baseWidth, record.baseHeight));
      const baseW = record.baseWidth * scale;
      const baseH = record.baseHeight * scale;
      record.viewport = (pageRotation % 180 === 90)
        ? { width: baseH, height: baseW }
        : { width: baseW, height: baseH };
      applyRecordSize(record, record.viewport);
    }

    async function prepareDocument(documentProxy) {
      // Loop 12: any previous document's records are disposed explicitly — cancel
      // in-flight renders, drop canvases and page proxies, and let ensurePage() discard
      // results that land after the swap.
      pageRecords.forEach(function (record) {
        record.disposed = true;
        if (record.renderTask) { try { record.renderTask.cancel(); } catch (_) {} }
        record.canvas.width = 0;
        record.canvas.height = 0;
        if (record.page) { try { record.page.cleanup(); } catch (_) {} }
      });
      const root = document.getElementById('pdf-document');
      root.replaceChildren();
      pageRecords = [];
      indexedPages.clear();
      indexedLruOrder.length = 0;
      currentPage = 0;

      // Loop 12 (Bug C): fetch only page 1 up front and use its geometry for every
      // placeholder (the official pdf.js viewer does the same). A 1000-page document
      // used to await 1000 sequential getPage() calls before onPdfDocumentLoaded —
      // why large PDFs took so long to open — and retained every page proxy for the
      // lifetime of the viewer.
      const firstPage = await documentProxy.getPage(1);
      const baseViewport = firstPage.getViewport({ scale: 1 });
      const placeholderScale = computePageScale(baseViewport.width);
      const placeholderWidth = baseViewport.width * placeholderScale;
      const placeholderHeight = baseViewport.height * placeholderScale;

      for (let pageNumber = 1; pageNumber <= documentProxy.numPages; pageNumber++) {
        const pageElement = document.createElement('section');
        // Loop 14: 'skeleton' until the first canvas lands; the dark 'natural' class
        // went away with the PDF night mode.
        pageElement.className = 'pdf-page skeleton';
        pageElement.dataset.pageNumber = String(pageNumber);
        const canvas = document.createElement('canvas');
        canvas.setAttribute('aria-label', 'Page ' + pageNumber);
        const highlightLayer = document.createElement('div');
        highlightLayer.className = 'highlight-layer';
        pageElement.appendChild(canvas);
        pageElement.appendChild(highlightLayer);
        root.appendChild(pageElement);
        const record = {
          pageNumber: pageNumber,
          page: pageNumber === 1 ? firstPage : null,
          element: pageElement,
          canvas: canvas,
          highlightLayer: highlightLayer,
          baseWidth: baseViewport.width,
          baseHeight: baseViewport.height,
          viewport: null,
          rendered: false,
          renderTask: null,
          renderStarting: false,
          renderFailed: false,
          failureOverlay: null,
          visible: false,
          lastRenderedAt: 0,
          pagePromise: null
        };
        pageRecords.push(record);
        if (pageNumber === 1) {
          updateRecordGeometry(record);
        } else {
          record.viewport = { width: placeholderWidth, height: placeholderHeight };
          applyRecordSize(record, record.viewport);
        }
        if (pageNumber % 32 === 0) await new Promise(function (resolve) { setTimeout(resolve, 0); });
      }

      if (pageObserver) pageObserver.disconnect();
      if ('IntersectionObserver' in window) {
        pageObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            const record = pageRecords[Number(entry.target.dataset.pageNumber) - 1];
            if (!record) return;
            if (entry.isIntersecting) {
              record.visible = true;
              renderRecord(record);
            } else {
              record.visible = false;
              releaseRecord(record);
            }
          });
        }, { root: null, rootMargin: '900px 0px', threshold: [0, .15, .5, .85] });
        pageRecords.forEach(function (record) { pageObserver.observe(record.element); });
      } else {
        // No IntersectionObserver: render the first pages and keep them marked
        // visible so the post-render residency check does not drop them again.
        pageRecords.slice(0, 4).forEach(function (record) {
          record.visible = true;
          renderRecord(record);
        });
      }
      bridgeCall('onPdfDocumentLoaded', documentProxy.numPages);
      if (pageRecords.length) {
        currentPage = 1;
        lastReportedPosition = -1;
        bridgeCall('onPdfPageChanged', currentPage, pageRecords.length);
        bridgeCall('onPdfScrollProgress', 1, pageRecords.length, 0);
      }
    }

    // ---------------------------------------------------------------------------
    // Opening the document. Three strategies, tried in order, each guarded by a stall
    // timer so a silently broken path (worker not reachable, range responses ignored)
    // falls through instead of leaving the user on an endless loading indicator:
    //   1. real worker + HTTP range requests (fast; only the pages actually read are
    //      transferred, which is what makes 100+ MB files open instantly);
    //   2. main-thread "fake worker" + range requests (no Worker / worker fetch needed);
    //   3. whole-file fetch in the page (last resort; memory heavy).
    // ---------------------------------------------------------------------------
    const stallLimitMs = 9000;
    const openGate = { timer: null, paused: false, rearm: null };
    let workerInMainThread = false;
    let lastProgressPercent = -1;

    function baseDocumentOptions() {
      return {
        cMapUrl: assetBase + 'cmaps/',
        cMapPacked: true,
        standardFontDataUrl: assetBase + 'standard_fonts/',
        isEvalSupported: false,
        enableXfa: false,
        maxImageSize: 16 * 1024 * 1024,
        verbosity: 0
      };
    }

    function reportLoadProgress(loaded, total) {
      if (!(total > 0)) return;
      const percent = Math.max(0, Math.min(99, Math.round((loaded / total) * 100)));
      if (percent !== lastProgressPercent) {
        lastProgressPercent = percent;
        bridgeCall('onPdfLoadProgress', percent);
      }
    }

    function awaitDocument(task) {
      return new Promise(function (resolve, reject) {
        openGate.paused = false;
        function arm() {
          clearTimeout(openGate.timer);
          if (openGate.paused) return;
          openGate.timer = setTimeout(function () { reject(new Error('stalled')); }, stallLimitMs);
        }
        openGate.rearm = arm;
        task.onPassword = function (updatePassword, reason) {
          // A password prompt is user time, not a stall.
          openGate.paused = true;
          clearTimeout(openGate.timer);
          passwordUpdater = updatePassword;
          bridgeCall('onPdfPasswordRequired', Number(reason) || 1);
        };
        task.onProgress = function (progress) {
          if (progress) reportLoadProgress(progress.loaded, progress.total);
          arm();
        };
        arm();
        task.promise.then(function (documentProxy) {
          clearTimeout(openGate.timer);
          resolve(documentProxy);
        }, function (error) {
          clearTimeout(openGate.timer);
          reject(error);
        });
      });
    }

    async function useMainThreadWorker() {
      if (workerInMainThread) return;
      // Importing the worker bundle into the page makes PDF.js run it on the main
      // thread (globalThis.pdfjsWorker) instead of spawning a Worker.
      await import('./pdf.worker.min.mjs');
      workerInMainThread = true;
    }

    function friendlyOpenError(error) {
      const name = error && error.name;
      if (name === 'InvalidPDFException') return 'This file is damaged or is not a valid PDF.';
      if (name === 'MissingPDFException') return 'The PDF file could not be found.';
      const text = String(error && (error.message || error) || '');
      if (text === 'stalled') return 'The PDF took too long to open. Try again, or open it with another app.';
      return text || 'Could not open this PDF';
    }

    async function loadPdf() {
      if (pdfDocument) return pdfDocument;
      if (loadingPromise) return loadingPromise;

      loadingPromise = (async function () {
        const strategies = [
          { label: 'worker+range', mainThread: false, wholeFile: false },
          { label: 'main-thread+range', mainThread: true, wholeFile: false },
          { label: 'main-thread+whole-file', mainThread: true, wholeFile: true }
        ];
        let lastError = null;
        for (let index = 0; index < strategies.length; index++) {
          const strategy = strategies[index];
          let task = null;
          try {
            lastProgressPercent = -1;
            if (strategy.mainThread) await useMainThreadWorker();
            const options = baseDocumentOptions();
            options.useWorkerFetch = !strategy.mainThread;
            if (strategy.wholeFile) {
              const response = await fetch(pdfUrl, { credentials: 'omit' });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              options.data = new Uint8Array(await response.arrayBuffer());
            } else {
              options.url = pdfUrl;
              options.disableRange = false;
              // Streaming would make PDF.js pull the whole file before page 1.
              options.disableStream = true;
              options.disableAutoFetch = true;
              options.rangeChunkSize = 512 * 1024;
            }
            task = pdfjsLib.getDocument(options);
            const documentProxy = await awaitDocument(task);
            pdfDocument = documentProxy;
            await prepareDocument(documentProxy);
            return documentProxy;
          } catch (error) {
            lastError = error;
            console.warn('PDF open strategy failed: ' + strategy.label, error);
            try { if (task) task.destroy(); } catch (_) {}
            pdfDocument = null;
          }
        }
        throw lastError || new Error('Could not open this PDF');
      })().catch(function (error) {
        loadingPromise = null;
        bridgeCall('onPdfError', friendlyOpenError(error));
        throw error;
      });
      return loadingPromise;
    }

    function clearHighlights() {
      searchMatches = [];
      activeMatchIndex = -1;
      pageRecords.forEach(drawHighlights);
    }

    function publishCurrentResults(requestId, query, count, truncated, searching) {
      publishResults({
        requestId: requestId,
        query: query,
        count: count,
        truncated: Boolean(truncated),
        searching: Boolean(searching),
        currentIndex: activeMatchIndex,
        // Geometry stays local to the reader; the Android bridge only needs navigation targets.
        matches: searchMatches.map(function (match) { return { pageNumber: match.pageNumber }; })
      });
    }

    async function searchPdf(rawQuery) {
      const requestId = ++latestRequestId;
      const query = String(rawQuery || '').trim();
      clearHighlights();
      if (!query) {
        publishCurrentResults(requestId, query, 0, false, false);
        return;
      }
      publishCurrentResults(requestId, query, 0, false, true);

      try {
        const documentProxy = await loadPdf();
        if (requestId !== latestRequestId) return;
        const expression = new RegExp(escapeRegExp(query), 'gi');
        const results = [];
        let totalCount = 0;

        for (let pageNumber = 1; pageNumber <= documentProxy.numPages; pageNumber++) {
          if (requestId !== latestRequestId) return;
          const page = await getIndexedPage(pageNumber);
          expression.lastIndex = 0;
          let match;
          while ((match = expression.exec(page.text)) !== null) {
            totalCount++;
            if (results.length < maxStoredMatches) {
              const matchStart = match.index;
              const matchEnd = matchStart + match[0].length;
              const rectangles = [];
              for (const piece of page.pieces) {
                if (piece.end <= matchStart || piece.start >= matchEnd) continue;
                const localStart = Math.max(0, matchStart - piece.start);
                const localEnd = Math.min(piece.str.length, matchEnd - piece.start);
                if (localEnd > localStart) {
                  rectangles.push(makeRect(page, piece, localStart, localEnd));
                  if (rectangles.length >= maxRectsPerMatch) break;
                }
              }
              results.push({ pageNumber: pageNumber, rectangles: rectangles });
            }
            if (match[0].length === 0) expression.lastIndex++;
          }
          if (pageNumber % 12 === 0) await new Promise(function (resolve) { setTimeout(resolve, 0); });
        }

        if (requestId !== latestRequestId) return;
        searchMatches = results;
        activeMatchIndex = results.length ? 0 : -1;
        pageRecords.forEach(drawHighlights);
        if (activeMatchIndex >= 0) showPdfSearchMatch(activeMatchIndex);
        publishCurrentResults(requestId, query, totalCount, totalCount > maxStoredMatches, false);
      } catch (error) {
        if (requestId === latestRequestId) {
          publishError(requestId, query, error);
        }
      }
    }

    function showPdfSearchMatch(index) {
      if (!searchMatches.length) {
        activeMatchIndex = -1;
        pageRecords.forEach(drawHighlights);
        return -1;
      }
      activeMatchIndex = ((Number(index) || 0) % searchMatches.length + searchMatches.length) % searchMatches.length;
      pageRecords.forEach(drawHighlights);
      const match = searchMatches[activeMatchIndex];
      const record = pageRecords[match.pageNumber - 1];
      if (record) {
        record.element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        renderRecord(record);
      }
      return activeMatchIndex;
    }

    function goToPdfPage(pageNumber) {
      const index = Math.max(0, Math.min(pageRecords.length - 1, Number(pageNumber) - 1));
      const record = pageRecords[index];
      if (record) {
        // Smooth scrolling across hundreds of pages would flip through every page in
        // between (rendering each); long jumps are instant, short ones animate.
        const distance = Math.abs(index - Math.max(0, (currentPage || 1) - 1));
        record.element.scrollIntoView({ behavior: distance > 3 ? 'auto' : 'smooth', block: 'start' });
        renderRecord(record);
      }
    }

    // Loop 14: PDF night mode was removed — the bridge entry point is gone. PDFs
    // always display in light mode.

    // Re-derives every page's size from the current width / zoom / rotation. Existing
    // bitmaps stay on screen (stretched) until the re-rendered ones replace them, so a
    // rotation or resize never flashes blank pages.
    function relayoutPages() {
      if (!pageRecords.length) return;
      const anchor = captureScrollAnchor();
      pageRecords.forEach(function (record) {
        if (record.page) updateRecordGeometry(record, true);
        else updatePlaceholderGeometry(record);
      });
      restoreScrollAnchor(anchor);
      if (pageObserver) {
        pageRecords.forEach(function (record) { pageObserver.unobserve(record.element); });
        pageRecords.forEach(function (record) { pageObserver.observe(record.element); });
      } else {
        pageRecords.slice(0, 4).forEach(renderRecord);
      }
      scheduleScrollReport();
    }

    function setPdfZoom(factor) {
      // Loop 14: the logical zoom cap follows the viewport's maximum-scale (8x).
      // Memory stays bounded: renderPixelRatio() clamps every canvas by the total
      // RGBA budget, the ratio cap and the 8192px dimension ceiling regardless of
      // how far the user pinches.
      currentZoom = Math.max(.25, Math.min(8, Number(factor) || 1));
      relayoutPages();
    }

    // ---------------------------------------------------------------------------
    // Loop 14: view rotation. The toolbar button pushes setPageRotation(deg);
    // everything else is derived here:
    //   - every record's geometry is re-derived with the rotation baked into the
    //     pdf.js viewport (quarter turns swap width/height), placeholders included;
    //   - old canvases are KEPT on screen while the correctly rotated replacements
    //     render offscreen, then swapped atomically (no blank flash, no page-1 reset);
    //   - the reading position is preserved with a page + within-page-fraction
    //     anchor (PdfRotationPolicy.scrollTopForAnchor mirrors the math);
    //   - search highlights re-map through rotateNormRect for the new orientation.
    // The authenticated document session is untouched: no reload, no password prompt.
    // ---------------------------------------------------------------------------
    function captureScrollAnchor() {
      const scroller = docScroller();
      if (!scroller || !pageRecords.length) return { page: Math.max(1, currentPage), fraction: 0, top: 0 };
      const scrollTop = scroller.scrollTop;
      // The page at the TOP of the viewport (not the one nearest the centre) so a
      // relayout never makes the reader jump to a different page.
      let index = pageIndexAtY(scrollTop);
      let record = pageRecords[index];
      if (record.element.offsetTop + record.element.offsetHeight <= scrollTop && index + 1 < pageRecords.length) {
        index++;
        record = pageRecords[index];
      }
      const elementTop = record.element.offsetTop;
      const elementHeight = Math.max(1, record.element.offsetHeight);
      const within = scrollTop - elementTop;
      return {
        page: record.pageNumber,
        fraction: Math.min(1, Math.max(0, within / elementHeight)),
        top: scrollTop
      };
    }

    function restoreScrollAnchor(anchor) {
      if (!anchor) return;
      const scroller = document.scrollingElement || document.documentElement || document.body;
      const record = pageRecords[anchor.page - 1];
      if (!scroller || !record || !record.element) {
        if (scroller && anchor.top != null) scroller.scrollTop = anchor.top;
        return;
      }
      // Mirrors PdfRotationPolicy.scrollTopForAnchor (clamped 0..1).
      const fraction = Math.min(1, Math.max(0, Number(anchor.fraction) || 0));
      scroller.scrollTop = record.element.offsetTop + fraction * Math.max(1, record.element.offsetHeight);
    }

    function setPageRotation(degrees) {
      const next = ((Math.round(Number(degrees) || 0) % 360) + 360) % 360;
      if (next === pageRotation || next % 90 !== 0 || !pdfDocument) return;
      pageRotation = next;
      relayoutPages();
      // Square pages keep their size, so updateRecordGeometry() skips them; re-render
      // every page that holds a bitmap so the new orientation shows.
      pageRecords.forEach(function (record) {
        if (record.canvas && record.canvas.width > 0 && !record.renderTask) {
          record.rendered = false;
          renderRecord(record);
        }
      });
    }

    function submitPdfPassword(password) {
      if (passwordUpdater) {
        const updatePassword = passwordUpdater;
        passwordUpdater = null;
        openGate.paused = false;
        if (openGate.rearm) openGate.rearm();
        updatePassword(String(password || ''));
      }
    }

    let lastTapTime = 0;
    let singleTapTimer = null;
    document.addEventListener('click', function (event) {
      if (event.target && event.target.closest && event.target.closest('button, a, input, textarea, select')) return;
      const now = Date.now();
      if (now - lastTapTime < 280) {
        lastTapTime = 0;
        if (singleTapTimer) { clearTimeout(singleTapTimer); singleTapTimer = null; }
        bridgeCall('onPdfDoubleTap');
      } else {
        lastTapTime = now;
        if (singleTapTimer) clearTimeout(singleTapTimer);
        singleTapTimer = setTimeout(function () {
          singleTapTimer = null;
          bridgeCall('onPdfSingleTap');
        }, 250);
      }
    });
    let resizeTimer = null;
    window.addEventListener('resize', function () {
      if (!pdfDocument || !pageRecords.length) return;
      clearTimeout(resizeTimer);
      // Debounced: resizing the WebView (focus mode, rotation) used to cancel and
      // re-render every page per frame, flashing blank canvases mid-transition.
      resizeTimer = setTimeout(relayoutPages, 120);
    });

    window.searchPdf = searchPdf;
    window.showPdfSearchMatch = showPdfSearchMatch;
    window.gotoPdfPage = goToPdfPage;
    window.setPdfZoom = setPdfZoom;
    window.scrubToPosition = scrubToPosition;
    window.setPageRotation = setPageRotation;
    window.setPdfRenderScale = setPdfRenderScale;
    window.setPdfQualityBudget = setPdfQualityBudget;
    window.retryPdfPage = retryPage;
    window.submitPdfPassword = submitPdfPassword;
    window.clearPdfSearch = function () {
      latestRequestId++;
      clearHighlights();
      publishCurrentResults(latestRequestId, '', 0, false, false);
    };
    window.AndroidPdfSearchReady = function () {
      bridgeCall('onPdfSearchReady', 'ready');
      loadPdf().catch(function () {});
    };
    window.AndroidPdfSearchReady();
  </script>
</body>
</html>
