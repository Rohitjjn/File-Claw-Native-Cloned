<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>File Claw Spreadsheet Viewer</title>
  <style>
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --text: #141413;
      --muted: #6c6a64;
      --border: #e6dfd8;
      --header: #f2eee8;
      --accent: #cc785c;
      --accent-soft: rgba(204,120,92,.18);
      --match: #ffe082;
      --match-active: #ff9800;
      --header-height: 32px;
      --row-header-width: 58px;
    }
    body.dark {
      --bg: #151514;
      --surface: #1e1d1b;
      --text: #f5f5f3;
      --muted: #aaa79f;
      --border: #383633;
      --header: #252320;
      --accent: #e8a55a;
      --accent-soft: rgba(232,165,90,.20);
      --match: #6b5625;
      --match-active: #b66a1c;
    }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif; font-size:13px; -webkit-text-size-adjust:100%; }
    #shell { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); }
    #notice { display:none; padding:8px 12px; background:var(--accent-soft); color:var(--text); border-bottom:1px solid var(--border); font-size:12px; line-height:1.35; }
    #notice.visible { display:block; }
    #grid-shell { position:relative; flex:1; min-height:0; overflow:hidden; background:var(--bg); }
    #corner { position:absolute; left:0; top:0; width:var(--row-header-width); height:var(--header-height); z-index:5; background:var(--header); border-right:1px solid var(--border); border-bottom:1px solid var(--border); box-sizing:border-box; }
    #column-headers { position:absolute; left:var(--row-header-width); right:0; top:0; height:var(--header-height); z-index:4; overflow:hidden; background:var(--header); border-bottom:1px solid var(--border); }
    #row-headers { position:absolute; left:0; top:var(--header-height); bottom:0; width:var(--row-header-width); z-index:4; overflow:hidden; background:var(--header); border-right:1px solid var(--border); }
    #viewport { position:absolute; left:var(--row-header-width); top:var(--header-height); right:0; bottom:0; overflow:auto; z-index:1; background:var(--surface); -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-x pan-y; outline:none; }
    #surface { position:relative; transform-origin:0 0; }
    #cells { position:absolute; inset:0; }
    .cell { position:absolute; box-sizing:border-box; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:7px 8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; background:var(--surface); color:var(--text); user-select:none; }
    .cell.alt { background:color-mix(in srgb, var(--surface) 96%, var(--accent)); }
    .cell.selected { outline:2px solid var(--accent); outline-offset:-2px; z-index:2; }
    .cell.search-match { background:var(--match); color:#241d0c; }
    .cell.search-active { background:var(--match-active); color:#ffffff; font-weight:700; }
    .header-cell { position:absolute; box-sizing:border-box; display:flex; align-items:center; justify-content:center; background:var(--header); color:var(--muted); border-right:1px solid var(--border); border-bottom:1px solid var(--border); font-size:11px; font-weight:700; overflow:hidden; }
    .row-header { border-right:1px solid var(--border); }
    #column-track, #row-track { position:absolute; left:0; top:0; will-change:transform; }
    #cell-editor { position:absolute; display:none; z-index:10; box-sizing:border-box; border:2px solid var(--accent); border-radius:2px; padding:6px 7px; font:inherit; color:var(--text); background:var(--surface); outline:none; min-width:40px; }
    #status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--muted); z-index:20; text-align:center; padding:24px; line-height:1.5; }
    #status.hidden { display:none; }
    #status.error { color:var(--accent); }
    @media (max-width: 480px) { :root { --row-header-width:46px; } }
    @media print {
      body { background:#fff; color:#111; }
      #notice, #corner, #column-headers, #row-headers, #cell-editor, #status { display:none !important; }
      #grid-shell, #viewport { position:static !important; inset:auto !important; overflow:visible !important; width:auto !important; height:auto !important; }
      #surface { zoom:1 !important; transform:none !important; }
      .cell { position:relative !important; display:inline-block; width:auto !important; min-width:80px; max-width:240px; height:auto !important; border:1px solid #ddd !important; font-size:10px; white-space:pre-wrap; word-break:break-word; }
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="grid-shell">
      <div id="corner" aria-hidden="true"></div>
      <div id="column-headers" aria-hidden="true"><div id="column-track"></div></div>
      <div id="row-headers" aria-hidden="true"><div id="row-track"></div></div>
      <div id="viewport" role="grid" aria-label="Spreadsheet cells" tabindex="0">
        <div id="surface"><div id="cells"></div></div>
      </div>
      <input id="cell-editor" type="text" aria-label="Edit cell value" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="status" role="status">Loading spreadsheet…</div>
    </div>
  </div>
  <script src="grid.js"></script>
</body>
</html>
