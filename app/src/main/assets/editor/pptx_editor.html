<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
  <title>File Claw Presentation Viewer</title>
  <script src="jszip.min.js"></script>
  <script src="pptx-preview.min.js"></script>
  <style>
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --text: #141413;
      --muted: #6c6a64;
      --border: #e6dfd8;
      --accent: #cc785c;
      --accent-soft: rgba(204,120,92,.14);
      --match: #ffe082;
      --match-active: #ff9800;
    }
    body.dark {
      --bg: #151514;
      --surface: #23211f;
      --text: #f5f5f3;
      --muted: #aaa79f;
      --border: #383633;
      --accent: #e8a55a;
      --accent-soft: rgba(232,165,90,.16);
      --match: #6b5625;
      --match-active: #b66a1c;
    }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif; -webkit-text-size-adjust:100%; }
    #shell { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); }
    #notice { display:none; padding:8px 12px; background:var(--accent-soft); border-bottom:1px solid var(--border); color:var(--text); font-size:12px; line-height:1.35; }
    #notice.visible { display:block; }
    #viewer-scroll { flex:1; min-height:0; overflow:auto; padding:14px 8px 96px; box-sizing:border-box; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-x pan-y; }
    #stage { position:relative; margin:0 auto; transform-origin:0 0; }
    #editor-container { position:relative; width:100%; min-height:200px; }
    /* The renderer's built-in circular buttons/pagination are replaced by the app's bottom tray. */
    .pptx-preview-wrapper-next, .pptx-preview-wrapper-pagination { display:none !important; }
    .pptx-preview-slide-wrapper { margin:0 auto 18px auto !important; border-radius:8px !important; overflow:hidden !important; box-shadow:0 4px 20px rgba(0,0,0,.12) !important; }
    body.dark .pptx-preview-slide-wrapper { box-shadow:0 4px 24px rgba(0,0,0,.6) !important; border:1px solid var(--border) !important; }
    .pptx-preview-slide-wrapper img { max-width:100%; max-height:100%; }
    .pptx-preview-slide-wrapper table { border-collapse:collapse; }
    .pptx-preview-slide-wrapper td, .pptx-preview-slide-wrapper th { border-color:var(--border) !important; }
    mark.pptx-highlight { background:var(--match); color:#241d0c; border-radius:3px; padding:0 2px; }
    mark.pptx-highlight-active { background:var(--match-active); color:#fff; outline:2px solid #b95d0a; }
    .fallback-card { width:100%; max-width:820px; min-height:120px; margin:0 auto 14px auto; padding:18px; box-sizing:border-box; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.08); white-space:pre-wrap; word-break:break-word; }
    .fallback-card h3 { margin:0 0 8px; color:var(--muted); font-size:12px; letter-spacing:.03em; }
    .fallback-banner { max-width:820px; margin:0 auto 12px auto; padding:10px 14px; border-radius:8px; background:var(--accent-soft); color:var(--text); font-size:13px; }
    #status { position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--bg); color:var(--muted); line-height:1.5; }
    #status.hidden { display:none; }
    #status.error { color:var(--accent); }
    .skeleton { width:min(820px,92vw); height:min(460px,60vh); border-radius:8px; background:linear-gradient(100deg,var(--surface) 30%,var(--accent-soft) 50%,var(--surface) 70%); background-size:200% 100%; animation:slide 1.3s infinite linear; }
    @keyframes slide { from { background-position:200% 0; } to { background-position:-200% 0; } }
    @media print {
      @page { size:landscape; margin:0; }
      html, body { width:auto !important; height:auto !important; overflow:visible !important; background:#fff !important; color:#111 !important; }
      #shell { position:static !important; }
      #notice, #status, .pptx-preview-wrapper-next, .pptx-preview-wrapper-pagination, .fallback-banner h3 { display:none !important; }
      #viewer-scroll { overflow:visible !important; padding:0 !important; height:auto !important; }
      #stage { zoom:1 !important; transform:none !important; width:auto !important; margin:0 !important; }
      #editor-container { width:auto !important; }
      .pptx-preview-slide-wrapper, .fallback-card { box-shadow:none !important; border:none !important; border-radius:0 !important; margin:0 !important; page-break-after:always; break-after:page; }
      .pptx-preview-slide-wrapper:last-child, .fallback-card:last-child { page-break-after:auto; break-after:auto; }
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="viewer-scroll" role="region" aria-label="Presentation slides">
      <div id="stage">
        <div id="editor-container" aria-live="polite"></div>
      </div>
    </div>
    <div id="status" role="status"><div><div class="skeleton"></div><div style="margin-top:14px">Loading presentation…</div></div></div>
  </div>

  <script>
  (function () {
    'use strict';
    var isPrintMode = new URLSearchParams(window.location.search).has('print');
    var scroller = document.getElementById('viewer-scroll');
    var stage = document.getElementById('stage');
    var container = document.getElementById('editor-container');
    var status = document.getElementById('status');
    var notice = document.getElementById('notice');

    var MIN_ZOOM = 0.5, MAX_ZOOM = 3.0;
    var MAX_SLIDES = 1000, MAX_SLIDE_XML = 2 * 1024 * 1024, MAX_MATCHES = 5000;
    var viewer = null;
    var fallbackMode = false;
    var slideCards = [];
    var slideTexts = [];
    var currentSlide = 0;
    var totalSlides = 0;
    var currentZoom = 1;
    var lastReportedZoom = 1;
    var searchQuery = '';
    var searchMatches = [];
    var currentMatch = -1;
    var searchTruncated = false;
    var layoutViewport = { width:0, height:0 };
    var viewportReady = false;
    var viewportWaiters = [];
    var loadStarted = false;

    function bridge(name) {
      return window.Android && typeof window.Android[name] === 'function' ? window.Android[name] : null;
    }
    function post(name) {
      var callback = bridge(name);
      if (callback) callback.apply(window.Android, Array.prototype.slice.call(arguments, 1));
    }
    function showStatus(message, isError) {
      status.innerHTML = '';
      var div = document.createElement('div');
      div.textContent = message || 'Loading presentation…';
      status.appendChild(div);
      status.classList.toggle('error', Boolean(isError));
      status.classList.remove('hidden');
    }
    function hideStatus() { status.classList.add('hidden'); }
    function showError(message) {
      showStatus(message, true);
      post('onDocumentError', String(message || 'Could not open this presentation.'));
    }
    function setNotice(text) {
      notice.textContent = text || '';
      notice.classList.toggle('visible', Boolean(text));
    }
    function notifyViewport(width, height) {
      layoutViewport.width = Math.max(0, Number(width) || 0);
      layoutViewport.height = Math.max(0, Number(height) || 0);
      if (layoutViewport.width >= 200 && layoutViewport.height >= 200) {
        viewportReady = true;
        while (viewportWaiters.length) viewportWaiters.shift()();
        applyStageSize();
      }
    }
    window.notifyViewport = notifyViewport;

    function waitForViewport() {
      if (isPrintMode || viewportReady) return Promise.resolve();
      var domWidth = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0);
      var domHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
      if (domWidth >= 200 && domHeight >= 200) return Promise.resolve();
      return new Promise(function (resolve) {
        var settled = false;
        function done() { if (!settled) { settled = true; resolve(); } }
        viewportWaiters.push(done);
        setTimeout(done, 3000);
      });
    }

    function baseWidth() {
      var width = layoutViewport.width || window.innerWidth || 360;
      return Math.max(280, Math.min(1280, width - 32));
    }
    function applyStageSize() {
      var width = baseWidth();
      stage.style.width = width + 'px';
      stage.style.zoom = String(currentZoom);
      container.style.width = width + 'px';
      container.style.minHeight = Math.round(width * 9 / 16) + 'px';
    }
    function setDarkMode(isDark) {
      document.body.classList.toggle('dark', Boolean(isDark) && !isPrintMode);
    }
    window.setDarkMode = setDarkMode;
    window.setNotice = setNotice;

    function setZoom(factor, notify) {
      var value = Number(factor);
      if (!isFinite(value)) value = 1;
      value = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, value));
      var old = currentZoom;
      if (Math.abs(old - value) < 0.001) return value;
      var centerX = (scroller.scrollLeft + scroller.clientWidth / 2) / old;
      var centerY = (scroller.scrollTop + scroller.clientHeight / 2) / old;
      currentZoom = value;
      applyStageSize();
      requestAnimationFrame(function () {
        scroller.scrollLeft = Math.max(0, centerX * value - scroller.clientWidth / 2);
        scroller.scrollTop = Math.max(0, centerY * value - scroller.clientHeight / 2);
      });
      if (notify !== false) {
        lastReportedZoom = value;
        post('onZoomChanged', value);
      }
      return value;
    }
    window.setZoom = setZoom;

    function xmlCodePoint(value) {
      var code = Number(value);
      if (!isFinite(code) || code <= 0 || code > 0x10FFFF || (code >= 0xD800 && code <= 0xDFFF)) return '';
      return code <= 0xFFFF ? String.fromCharCode(code) : String.fromCodePoint(code);
    }
    function decodeXml(value) {
      // Numeric entities and the five XML entities only. Decoded text is always
      // assigned with textContent, never inserted as HTML.
      return String(value || '')
        .replace(/&#x([0-9a-f]+);/gi, function (_, hex) { return xmlCodePoint(parseInt(hex, 16)); })
        .replace(/&#(\d+);/g, function (_, dec) { return xmlCodePoint(parseInt(dec, 10)); })
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
        .replace(/&apos;/g, "'").replace(/&amp;/g, '&');
    }
    function extractSlideText(xml) {
      var values = [];
      var re = /<a:t>([\s\S]*?)<\/a:t>/g;
      var match;
      while ((match = re.exec(xml)) !== null) {
        values.push(decodeXml(match[1]));
        if (values.length > 20000) break;
      }
      return values.join(' ').trim();
    }
    function slideFileNames(zip) {
      return Object.keys(zip.files)
        .filter(function (name) { return /^ppt\/slides\/slide\d+\.xml$/.test(name); })
        .sort(function (a, b) {
          return parseInt(a.match(/slide(\d+)\.xml/)[1], 10) - parseInt(b.match(/slide(\d+)\.xml/)[1], 10);
        })
        .slice(0, MAX_SLIDES);
    }
    function readSlideTexts(arrayBuffer) {
      return JSZip.loadAsync(arrayBuffer).then(function (zip) {
        var names = slideFileNames(zip);
        if (!names.length) throw new Error('No slides found in this presentation.');
        return Promise.all(names.map(function (name) {
          return zip.files[name].async('string').then(function (xml) {
            return extractSlideText(xml.slice(0, MAX_SLIDE_XML));
          });
        }));
      });
    }

    function clearHighlights() {
      var marks = container.querySelectorAll('mark.pptx-highlight');
      for (var i = 0; i < marks.length; i++) {
        var parent = marks[i].parentNode;
        if (!parent) continue;
        parent.replaceChild(document.createTextNode(marks[i].textContent || ''), marks[i]);
        parent.normalize();
      }
    }
    function highlightCurrentSlide(occurrence) {
      clearHighlights();
      if (!searchQuery) return false;
      var query = searchQuery.toLocaleLowerCase();
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {
          var parent = node.parentElement;
          if (!parent || !node.nodeValue || parent.closest('script,style,mark.pptx-highlight')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      var seen = 0;
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var text = node.nodeValue || '';
        var lower = text.toLocaleLowerCase();
        var index = lower.indexOf(query);
        if (index < 0) continue;
        var fragment = document.createDocumentFragment();
        var last = 0;
        while (index >= 0) {
          fragment.appendChild(document.createTextNode(text.substring(last, index)));
          var mark = document.createElement('mark');
          mark.className = 'pptx-highlight';
          if (seen === occurrence) mark.classList.add('pptx-highlight-active');
          mark.textContent = text.substring(index, index + query.length);
          fragment.appendChild(mark);
          seen++;
          last = index + query.length;
          index = lower.indexOf(query, last);
        }
        fragment.appendChild(document.createTextNode(text.substring(last)));
        if (node.parentNode) node.parentNode.replaceChild(fragment, node);
      }
      var active = container.querySelector('mark.pptx-highlight-active');
      if (active) active.scrollIntoView({ behavior:'smooth', block:'center' });
      return Boolean(active);
    }
    function notifySearchCount() {
      post('onSearchResultCount', searchMatches.length, currentMatch, searchTruncated);
    }
    function highlightMatch(index) {
      clearHighlights();
      if (!searchMatches.length) { currentMatch = -1; notifySearchCount(); return 0; }
      currentMatch = ((index % searchMatches.length) + searchMatches.length) % searchMatches.length;
      var match = searchMatches[currentMatch];
      goToSlide(match.slide, false);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { highlightCurrentSlide(match.occurrence); });
      });
      notifySearchCount();
      return currentMatch + 1;
    }
    function searchWord(keyword) {
      clearHighlights();
      searchQuery = String(keyword || '').trim();
      searchMatches = [];
      currentMatch = -1;
      searchTruncated = false;
      if (!searchQuery) { notifySearchCount(); return 0; }
      var query = searchQuery.toLocaleLowerCase();
      for (var slide = 0; slide < slideTexts.length; slide++) {
        var lower = String(slideTexts[slide] || '').toLocaleLowerCase();
        var index = lower.indexOf(query);
        var occurrence = 0;
        while (index >= 0) {
          if (searchMatches.length < MAX_MATCHES) searchMatches.push({ slide:slide, occurrence:occurrence });
          else searchTruncated = true;
          occurrence++;
          index = lower.indexOf(query, index + query.length);
          if (occurrence > 20000) break;
        }
      }
      if (searchMatches.length) highlightMatch(0);
      else notifySearchCount();
      return searchMatches.length;
    }
    function nextSearchMatch() { return highlightMatch(currentMatch + 1); }
    function prevSearchMatch() { return highlightMatch(currentMatch - 1); }
    window.searchWord = searchWord;
    window.nextSearchMatch = nextSearchMatch;
    window.prevSearchMatch = prevSearchMatch;

    function slideChanged() {
      post('onSlideChanged', currentSlide + 1, totalSlides);
    }
    function goToSlide(oneBasedOrZero, notify) {
      var index = Number(oneBasedOrZero);
      if (!isFinite(index)) return false;
      index = Math.max(0, Math.min(totalSlides - 1, Math.floor(index)));
      currentSlide = index;
      if (fallbackMode) {
        var card = slideCards[index];
        if (card) card.scrollIntoView({ behavior:isPrintMode ? 'auto' : 'smooth', block:'start' });
      } else if (viewer && typeof viewer.renderSingleSlide === 'function') {
        try {
          viewer.currentIndex = index;
          viewer.renderSingleSlide(index);
          if (typeof viewer.updatePagination === 'function') viewer.updatePagination();
        } catch (error) {
          showError('This slide could not be rendered: ' + (error && error.toString ? error.toString() : 'unknown error'));
          return false;
        }
      }
      if (notify !== false) slideChanged();
      return true;
    }
    window.goToSlide = goToSlide;
    function nextSlide() { return goToSlide(currentSlide >= totalSlides - 1 ? 0 : currentSlide + 1); }
    function prevSlide() { return goToSlide(currentSlide <= 0 ? totalSlides - 1 : currentSlide - 1); }
    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;

    function renderTextFallback(arrayBuffer, reason) {
      fallbackMode = true;
      post('onRendererFallback', true);
      return readSlideTexts(arrayBuffer).then(function (texts) {
        slideTexts = texts;
        totalSlides = texts.length;
        container.innerHTML = '';
        var banner = document.createElement('div');
        banner.className = 'fallback-banner';
        banner.textContent = 'Showing slide text only — this presentation could not be fully formatted.';
        container.appendChild(banner);
        slideCards = texts.map(function (text, index) {
          var card = document.createElement('div');
          card.className = 'fallback-card';
          var heading = document.createElement('h3');
          heading.textContent = 'Slide ' + (index + 1);
          var body = document.createElement('div');
          body.textContent = text || '(no text on this slide)';
          card.appendChild(heading);
          card.appendChild(body);
          container.appendChild(card);
          return card;
        });
        hideStatus();
        post('onDocumentLoaded', totalSlides);
        if (isPrintMode) post('onPrintReady');
        else { currentSlide = 0; slideChanged(); }
      }).catch(function (error) {
        showError((reason || 'Presentation rendering failed') + ' Text recovery also failed: ' + (error && error.toString ? error.toString() : 'unknown error'));
      });
    }

    function finishFormattedRender(slides) {
      totalSlides = Math.max(1, Number(slides) || 1);
      hideStatus();
      post('onDocumentLoaded', totalSlides);
      if (isPrintMode) {
        Promise.race([
          document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(),
          new Promise(function (resolve) { setTimeout(resolve, 4000); })
        ]).then(function () { requestAnimationFrame(function () { post('onPrintReady'); }); });
      } else {
        currentSlide = 0;
        slideChanged();
      }
    }

    function loadPptx(source, isDark) {
      if (loadStarted) return Promise.resolve();
      loadStarted = true;
      window.__pptxBooted = true;
      setDarkMode(isDark);
      if (typeof pptxPreview === 'undefined' || typeof JSZip === 'undefined') {
        showError('Required presentation libraries failed to load.');
        return Promise.resolve();
      }
      return waitForViewport().then(function () {
        applyStageSize();
        return fetch('/pptx-src/presentation.pptx', { credentials:'omit', cache:'no-store' });
      }).then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.arrayBuffer();
      }).then(function (arrayBuffer) {
        return readSlideTexts(arrayBuffer).then(function (texts) {
          slideTexts = texts;
          return arrayBuffer;
        });
      }).then(function (arrayBuffer) {
        var width = baseWidth();
        var height = Math.round(width * 9 / 16);
        return new Promise(function (resolve, reject) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              try {
                viewer = pptxPreview.init(container, {
                  width:width,
                  height:height,
                  mode:isPrintMode ? 'list' : 'slide'
                });
                viewer.preview(arrayBuffer).then(function (pptx) {
                  finishFormattedRender((pptx && pptx.slides && pptx.slides.length) || viewer.slideCount || slideTexts.length);
                  resolve();
                }).catch(function (error) {
                  renderTextFallback(arrayBuffer, error && error.toString ? error.toString() : 'Renderer error').then(resolve).catch(reject);
                });
              } catch (error) {
                renderTextFallback(arrayBuffer, error && error.toString ? error.toString() : 'Renderer error').then(resolve).catch(reject);
              }
            });
          });
        });
      }).catch(function (error) {
        showError('Could not read the presentation file: ' + (error && error.toString ? error.toString() : 'unknown error'));
      });
    }
    window.loadPptx = loadPptx;

    window.addEventListener('error', function (event) {
      if (window.__pptxBooted || window.__pptxBootReported) return;
      window.__pptxBootReported = true;
      showError('The presentation engine could not start (' + (event && event.message || 'unknown') + ').');
    });
    window.addEventListener('resize', applyStageSize);
    window.addEventListener('pageshow', applyStageSize);

    var lastTapAt = 0, lastX = 0, lastY = 0, singleTapTimer = null;
    scroller.addEventListener('click', function (event) {
      if (isPrintMode) return;
      if (event.target && event.target.closest && event.target.closest('a,button,input,textarea,mark')) return;
      var now = Date.now();
      var distance = Math.hypot(event.clientX - lastX, event.clientY - lastY);
      if (now - lastTapAt < 280 && distance < 40) {
        lastTapAt = 0;
        if (singleTapTimer) { clearTimeout(singleTapTimer); singleTapTimer = null; }
        setZoom(currentZoom > 1.4 ? 1 : 2);
        post('onDocumentDoubleTap');
      } else {
        lastTapAt = now; lastX = event.clientX; lastY = event.clientY;
        if (singleTapTimer) clearTimeout(singleTapTimer);
        singleTapTimer = setTimeout(function () {
          singleTapTimer = null;
          post('onDocumentTap');
        }, 250);
      }
    });

    var pinchStart = 0, pinchZoom = 1;
    scroller.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 2) return;
      pinchStart = Math.hypot(event.touches[0].clientX - event.touches[1].clientX, event.touches[0].clientY - event.touches[1].clientY);
      pinchZoom = currentZoom;
    }, { passive:true });
    scroller.addEventListener('touchmove', function (event) {
      if (event.touches.length !== 2 || pinchStart < 8 || isPrintMode) return;
      event.preventDefault();
      var distance = Math.hypot(event.touches[0].clientX - event.touches[1].clientX, event.touches[0].clientY - event.touches[1].clientY);
      setZoom(pinchZoom * distance / pinchStart, false);
    }, { passive:false });
    scroller.addEventListener('touchend', function (event) {
      if (event.touches.length < 2 && pinchStart > 0) {
        pinchStart = 0;
        lastReportedZoom = currentZoom;
        post('onZoomChanged', currentZoom);
      }
    }, { passive:true });

    document.addEventListener('keydown', function (event) {
      if (isPrintMode || !totalSlides) return;
      if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); nextSlide(); }
      else if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); prevSlide(); }
    });
  }());
  </script>
</body>
</html>
